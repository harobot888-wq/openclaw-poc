<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Calculator</title>
    <style>
        body {
            background-color: #000000; /* Black Background */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 340px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            max-height: 700px;
            background: #000000; /* Black Container */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .display-container {
            margin-bottom: 30px;
            text-align: right;
            padding-right: 10px;
        }

        .display {
            font-size: 70px;
            font-weight: 300;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 80px;
        }

        .sub-display {
            font-size: 24px;
            color: #a5a5a5;
            height: auto;
            min-height: 40px;
            margin-top: 5px;
            font-weight: 400;
            line-height: 1.2;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 50%; /* Circular buttons like iOS */
            font-size: 28px;
            height: 65px;
            width: 65px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            filter: brightness(1.5);
        }

        /* Dark Theme Button Styles */
        .btn-glass {
            background: #333333;
            color: #ffffff;
        }

        .btn-accent {
            background: #ff9f0a;
            color: #ffffff;
            font-weight: 500;
        }

        .btn-op {
            background: #a5a5a5;
            color: #000000;
            font-weight: 500;
        }
        
        .btn-zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            padding-left: 25px;
            justify-content: flex-start;
        }
        
        .btn-currency {
            font-size: 12px;
            font-weight: bold;
            line-height: 1.1;
            flex-direction: column;
            background: #1c1c1e;
            color: #0a84ff;
            border: 1px solid #0a84ff;
            border-radius: 15px;
        }

        @media (max-width: 360px) {
            button { height: 60px; width: 60px; font-size: 24px; }
            .display { font-size: 50px; }
            .calculator { padding: 15px; border-radius: 0; max-height: 100vh; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-container">
        <div class="display" id="display">0</div>
        <div class="sub-display" id="subDisplay">¥ 0<br>HK$ 0</div>
    </div>

    <div class="buttons">
        <button class="btn-op" onclick="clearDisplay()">AC</button>
        <button class="btn-op" onclick="toggleSign()">+/-</button>
        <button class="btn-op" onclick="percent()">%</button>
        <button class="btn-accent" onclick="setOperation('/')">÷</button>

        <button class="btn-glass" onclick="appendNumber('7')">7</button>
        <button class="btn-glass" onclick="appendNumber('8')">8</button>
        <button class="btn-glass" onclick="appendNumber('9')">9</button>
        <button class="btn-accent" onclick="setOperation('*')">×</button>

        <button class="btn-glass" onclick="appendNumber('4')">4</button>
        <button class="btn-glass" onclick="appendNumber('5')">5</button>
        <button class="btn-glass" onclick="appendNumber('6')">6</button>
        <button class="btn-accent" onclick="setOperation('-')">−</button>

        <button class="btn-glass" onclick="appendNumber('1')">1</button>
        <button class="btn-glass" onclick="appendNumber('2')">2</button>
        <button class="btn-glass" onclick="appendNumber('3')">3</button>
        <button class="btn-accent" onclick="setOperation('+')">+</button>

        <button class="btn-glass btn-zero" onclick="appendNumber('0')">0</button>
        <button class="btn-glass" onclick="appendDot()">.</button>
        <button class="btn-currency" onclick="toggleCurrencyMode()">
            <span id="currencyLabel">USD<br>➔<br>JPY/HKD</span>
        </button>
        <button class="btn-accent" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = null;
    let operation = null;
    let shouldResetDisplay = false;
    
    // Currency State
    let rates = { JPY: 150.0, HKD: 7.8 };
    let baseCurrency = 'USD'; // 'USD', 'JPY', or 'HKD'

    const displayElement = document.getElementById('display');
    const subDisplayElement = document.getElementById('subDisplay');
    const currencyLabel = document.getElementById('currencyLabel');

    // Fetch live rates
    function fetchRates() {
        fetch('https://api.exchangerate-api.com/v4/latest/USD')
            .then(response => response.json())
            .then(data => {
                if (data && data.rates) {
                    rates.JPY = data.rates.JPY;
                    rates.HKD = data.rates.HKD;
                    updateDisplay();
                }
            })
            .catch(err => console.log('Currency fetch failed'));
    }
    fetchRates();

    function updateDisplay() {
        let displayValue = currentInput;
        if (displayValue.length > 9) {
            displayValue = displayValue.substring(0, 9);
        }
        displayElement.innerText = displayValue;
        
        if (displayValue.length > 6) displayElement.style.fontSize = '50px';
        else displayElement.style.fontSize = '70px';

        const numericValue = parseFloat(currentInput);
        if (!isNaN(numericValue)) {
            let outputs = [];
            
            if (baseCurrency === 'USD') {
                outputs.push('¥ ' + (numericValue * rates.JPY).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
                outputs.push('HK$ ' + (numericValue * rates.HKD).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            } else if (baseCurrency === 'JPY') {
                outputs.push('$ ' + (numericValue / rates.JPY).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
                outputs.push('HK$ ' + (numericValue / rates.JPY * rates.HKD).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            } else if (baseCurrency === 'HKD') {
                outputs.push('$ ' + (numericValue / rates.HKD).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
                outputs.push('¥ ' + (numericValue / rates.HKD * rates.JPY).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            }
            
            subDisplayElement.innerHTML = outputs.join('<br>');
        } else {
            subDisplayElement.innerText = '';
        }
    }

    function toggleCurrencyMode() {
        if (baseCurrency === 'USD') {
            baseCurrency = 'JPY';
            currencyLabel.innerHTML = 'JPY<br>➔<br>USD/HKD';
        } else if (baseCurrency === 'JPY') {
            baseCurrency = 'HKD';
            currencyLabel.innerHTML = 'HKD<br>➔<br>USD/JPY';
        } else {
            baseCurrency = 'USD';
            currencyLabel.innerHTML = 'USD<br>➔<br>JPY/HKD';
        }
        updateDisplay();
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendDot() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
        } else if (!currentInput.includes('.')) {
            currentInput += '.';
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = null;
        operation = null;
        shouldResetDisplay = false;
        updateDisplay();
    }

    function toggleSign() {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
    }

    function percent() {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
    }

    function setOperation(op) {
        if (operation !== null) calculate();
        previousInput = currentInput;
        operation = op;
        shouldResetDisplay = true;
    }

    function calculate() {
        if (operation === null || shouldResetDisplay) return;
        
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        let result;

        switch (operation) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '*': result = prev * current; break;
            case '/': result = prev / current; break;
            default: return;
        }

        currentInput = result.toString();
        operation = null;
        previousInput = null;
        shouldResetDisplay = true;
        updateDisplay();
    }
</script>

</body>
</html>
