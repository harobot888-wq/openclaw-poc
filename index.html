<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator + Currency</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            max-height: 650px;
        }

        .display-container {
            margin-bottom: 20px;
            text-align: right;
            padding-right: 10px;
        }

        .display {
            font-size: 70px;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 80px;
        }

        .sub-display {
            font-size: 30px;
            color: #a5a5a5;
            height: 40px;
            margin-top: 5px;
            font-weight: 400;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 50%;
            font-size: 30px;
            height: 70px;
            width: 70px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.7;
        }

        .btn-gray { background-color: #a5a5a5; color: black; }
        .btn-dark { background-color: #333333; color: white; }
        .btn-orange { background-color: #ff9f0a; color: white; }
        
        .btn-zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            padding-left: 30px;
            justify-content: flex-start;
        }
        
        /* Currency Toggle Button Style */
        .btn-currency {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.2;
            flex-direction: column;
        }

        @media (max-width: 350px) {
            button { height: 60px; width: 60px; font-size: 24px; }
            .display { font-size: 50px; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-container">
        <div class="display" id="display">0</div>
        <div class="sub-display" id="subDisplay">¥ 0</div>
    </div>

    <div class="buttons">
        <button class="btn-gray" onclick="clearDisplay()">AC</button>
        <button class="btn-gray" onclick="toggleSign()">+/-</button>
        <button class="btn-gray" onclick="percent()">%</button>
        <button class="btn-orange" onclick="setOperation('/')">÷</button>

        <button class="btn-dark" onclick="appendNumber('7')">7</button>
        <button class="btn-dark" onclick="appendNumber('8')">8</button>
        <button class="btn-dark" onclick="appendNumber('9')">9</button>
        <button class="btn-orange" onclick="setOperation('*')">×</button>

        <button class="btn-dark" onclick="appendNumber('4')">4</button>
        <button class="btn-dark" onclick="appendNumber('5')">5</button>
        <button class="btn-dark" onclick="appendNumber('6')">6</button>
        <button class="btn-orange" onclick="setOperation('-')">−</button>

        <button class="btn-dark" onclick="appendNumber('1')">1</button>
        <button class="btn-dark" onclick="appendNumber('2')">2</button>
        <button class="btn-dark" onclick="appendNumber('3')">3</button>
        <button class="btn-orange" onclick="setOperation('+')">+</button>

        <button class="btn-dark btn-zero" onclick="appendNumber('0')">0</button>
        <button class="btn-dark" onclick="appendDot()">.</button>
        <!-- Currency Toggle Button -->
        <button class="btn-orange btn-currency" onclick="toggleCurrencyMode()">
            <span id="currencyLabel">USD<br>↓<br>JPY</span>
        </button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = null;
    let operation = null;
    let shouldResetDisplay = false;
    
    // Currency State
    let exchangeRate = 150.0; // Fallback rate
    let currencyMode = 'USD_TO_JPY'; // or 'JPY_TO_USD'

    const displayElement = document.getElementById('display');
    const subDisplayElement = document.getElementById('subDisplay');
    const currencyLabel = document.getElementById('currencyLabel');

    // Fetch live rate immediately
    fetch('https://api.exchangerate-api.com/v4/latest/USD')
        .then(response => response.json())
        .then(data => {
            if (data && data.rates && data.rates.JPY) {
                exchangeRate = data.rates.JPY;
                updateDisplay(); // update initial sub-display with live rate
            }
        })
        .catch(err => console.log('Currency fetch failed, using fallback 150.0'));

    function updateDisplay() {
        // Main Display Logic
        let displayValue = currentInput;
        if (displayValue.length > 9) {
            displayValue = displayValue.substring(0, 9);
        }
        displayElement.innerText = displayValue;
        
        // Font scaling
        if (displayValue.length > 6) displayElement.style.fontSize = '50px';
        else displayElement.style.fontSize = '70px';

        // Currency Conversion Logic
        const numericValue = parseFloat(currentInput);
        if (!isNaN(numericValue)) {
            let converted;
            let symbol;
            
            if (currencyMode === 'USD_TO_JPY') {
                converted = (numericValue * exchangeRate).toFixed(2);
                symbol = '¥';
            } else {
                converted = (numericValue / exchangeRate).toFixed(2);
                symbol = '$';
            }
            
            // Format with commas
            subDisplayElement.innerText = symbol + ' ' + parseFloat(converted).toLocaleString();
        } else {
            subDisplayElement.innerText = '';
        }
    }

    function toggleCurrencyMode() {
        if (currencyMode === 'USD_TO_JPY') {
            currencyMode = 'JPY_TO_USD';
            currencyLabel.innerHTML = 'JPY<br>↓<br>USD';
        } else {
            currencyMode = 'USD_TO_JPY';
            currencyLabel.innerHTML = 'USD<br>↓<br>JPY';
        }
        updateDisplay();
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendDot() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
        } else if (!currentInput.includes('.')) {
            currentInput += '.';
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = null;
        operation = null;
        shouldResetDisplay = false;
        updateDisplay();
    }

    function toggleSign() {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
    }

    function percent() {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
    }

    function setOperation(op) {
        if (operation !== null) calculate();
        previousInput = currentInput;
        operation = op;
        shouldResetDisplay = true;
    }

    function calculate() {
        if (operation === null || shouldResetDisplay) return;
        
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        let result;

        switch (operation) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '*': result = prev * current; break;
            case '/': result = prev / current; break;
            default: return;
        }

        currentInput = result.toString();
        operation = null;
        previousInput = null;
        shouldResetDisplay = true;
        updateDisplay();
    }
</script>

</body>
</html>
