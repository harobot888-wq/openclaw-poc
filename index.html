<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Calculator</title>
    <style>
        body {
            background-color: #000000; /* Black Background */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 340px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            max-height: 750px;
            background: #000000; /* Black Container */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .display-container {
            margin-bottom: 20px;
            text-align: right;
            padding-right: 10px;
        }

        .display {
            font-size: 60px;
            font-weight: 300;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 70px;
        }

        .sub-display {
            font-size: 24px;
            color: #a5a5a5;
            height: auto;
            min-height: 30px;
            margin-top: 5px;
            font-weight: 400;
            line-height: 1.2;
        }

        .currency-selectors {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .currency-select {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
            width: 45%;
        }

        .arrow {
            color: #ff9f0a;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 50%; /* Circular buttons like iOS */
            font-size: 28px;
            height: 65px;
            width: 65px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            filter: brightness(1.5);
        }

        /* Dark Theme Button Styles */
        .btn-glass {
            background: #333333;
            color: #ffffff;
        }

        .btn-accent {
            background: #ff9f0a;
            color: #ffffff;
            font-weight: 500;
        }

        .btn-op {
            background: #a5a5a5;
            color: #000000;
            font-weight: 500;
        }
        
        .btn-zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            padding-left: 25px;
            justify-content: flex-start;
        }
        
        @media (max-width: 360px) {
            button { height: 60px; width: 60px; font-size: 24px; }
            .display { font-size: 50px; }
            .calculator { padding: 15px; border-radius: 0; max-height: 100vh; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-container">
        <div class="display" id="display">0</div>
        <div class="sub-display" id="subDisplay">Loading...</div>
    </div>

    <div class="currency-selectors">
        <select id="fromCurrency" class="currency-select" onchange="updateDisplay()">
            <!-- Options populated by JS -->
        </select>
        <span class="arrow">➔</span>
        <select id="toCurrency" class="currency-select" onchange="updateDisplay()">
            <!-- Options populated by JS -->
        </select>
    </div>

    <div class="buttons">
        <button class="btn-op" onclick="clearDisplay()">AC</button>
        <button class="btn-op" onclick="toggleSign()">+/-</button>
        <button class="btn-op" onclick="percent()">%</button>
        <button class="btn-accent" onclick="setOperation('/')">÷</button>

        <button class="btn-glass" onclick="appendNumber('7')">7</button>
        <button class="btn-glass" onclick="appendNumber('8')">8</button>
        <button class="btn-glass" onclick="appendNumber('9')">9</button>
        <button class="btn-accent" onclick="setOperation('*')">×</button>

        <button class="btn-glass" onclick="appendNumber('4')">4</button>
        <button class="btn-glass" onclick="appendNumber('5')">5</button>
        <button class="btn-glass" onclick="appendNumber('6')">6</button>
        <button class="btn-accent" onclick="setOperation('-')">−</button>

        <button class="btn-glass" onclick="appendNumber('1')">1</button>
        <button class="btn-glass" onclick="appendNumber('2')">2</button>
        <button class="btn-glass" onclick="appendNumber('3')">3</button>
        <button class="btn-accent" onclick="setOperation('+')">+</button>

        <button class="btn-glass btn-zero" onclick="appendNumber('0')">0</button>
        <button class="btn-glass" onclick="appendDot()">.</button>
        <button class="btn-accent" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = null;
    let operation = null;
    let shouldResetDisplay = false;
    
    // Currency State
    const currencies = ['USD', 'EUR', 'GBP', 'JPY', 'HKD', 'CNY', 'AUD', 'CAD', 'SGD', 'KRW'];
    let rates = {}; // Base USD

    const displayElement = document.getElementById('display');
    const subDisplayElement = document.getElementById('subDisplay');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');

    // Initialize Dropdowns
    function initDropdowns() {
        currencies.forEach(currency => {
            let option1 = document.createElement("option");
            option1.text = currency;
            option1.value = currency;
            fromSelect.add(option1);

            let option2 = document.createElement("option");
            option2.text = currency;
            option2.value = currency;
            toSelect.add(option2);
        });
        
        // Defaults
        fromSelect.value = 'USD';
        toSelect.value = 'JPY';
    }
    initDropdowns();

    // Fetch live rates
    function fetchRates() {
        fetch('https://api.exchangerate-api.com/v4/latest/USD')
            .then(response => response.json())
            .then(data => {
                if (data && data.rates) {
                    rates = data.rates;
                    updateDisplay();
                }
            })
            .catch(err => {
                console.log('Currency fetch failed');
                subDisplayElement.innerText = "Rate Error";
            });
    }
    fetchRates();

    function updateDisplay() {
        let displayValue = currentInput;
        // Basic font sizing
        if (displayValue.length > 9) {
            displayValue = displayValue.substring(0, 9);
        }
        displayElement.innerText = displayValue;
        
        if (displayValue.length > 7) displayElement.style.fontSize = '50px';
        else displayElement.style.fontSize = '60px';

        // Conversion
        const numericValue = parseFloat(currentInput);
        if (!isNaN(numericValue) && rates[fromSelect.value] && rates[toSelect.value]) {
            // Convert From -> USD -> To
            // Amount / Rate(From) * Rate(To)
            const fromRate = rates[fromSelect.value]; // Rate of 'From' against USD
            const toRate = rates[toSelect.value];     // Rate of 'To' against USD
            
            const converted = (numericValue / fromRate) * toRate;
            
            // Format
            const symbol = toSelect.value;
            subDisplayElement.innerText = `${toSelect.value} ${converted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        } else {
            if (Object.keys(rates).length === 0) {
                 subDisplayElement.innerText = "Loading rates...";
            } else {
                 subDisplayElement.innerText = "";
            }
        }
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendDot() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
        } else if (!currentInput.includes('.')) {
            currentInput += '.';
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = null;
        operation = null;
        shouldResetDisplay = false;
        updateDisplay();
    }

    function toggleSign() {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
    }

    function percent() {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
    }

    function setOperation(op) {
        if (operation !== null) calculate();
        previousInput = currentInput;
        operation = op;
        shouldResetDisplay = true;
    }

    function calculate() {
        if (operation === null || shouldResetDisplay) return;
        
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        let result;

        switch (operation) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '*': result = prev * current; break;
            case '/': result = prev / current; break;
            default: return;
        }

        // Limit result length/precision to avoid overflow
        currentInput = result.toString();
        // Simple check for Scientific notation or too long
        if (currentInput.length > 10) {
             currentInput = result.toPrecision(10).toString();
        }

        operation = null;
        previousInput = null;
        shouldResetDisplay = true;
        updateDisplay();
    }
</script>

</body>
</html>
