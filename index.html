<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on mobile */
        }

        .calculator {
            width: 100%;
            max-width: 320px; /* iPhone width-ish */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%; /* Fill screen on mobile */
            max-height: 600px; /* Limit height on desktop */
        }

        .display {
            font-size: 80px;
            text-align: right;
            margin-bottom: 20px;
            padding-right: 20px;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 100px; /* Fixed height for display */
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 50%;
            font-size: 32px;
            height: 70px; /* Fixed height */
            width: 70px;  /* Fixed width (mostly) */
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.7;
        }

        /* Colors */
        .btn-gray {
            background-color: #a5a5a5;
            color: black;
        }

        .btn-dark {
            background-color: #333333;
            color: white;
        }

        .btn-orange {
            background-color: #ff9f0a;
            color: white;
            font-weight: 500;
        }

        /* Specific button styling */
        .btn-zero {
            grid-column: span 2;
            width: 100%; /* Stretch across 2 columns */
            border-radius: 35px; /* Pill shape */
            padding-left: 30px; /* Align text leftish */
            justify-content: flex-start;
        }

        /* Responsive tweaks */
        @media (max-width: 350px) {
            button {
                height: 60px;
                width: 60px;
                font-size: 24px;
            }
            .display {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <button class="btn-gray" onclick="clearDisplay()">AC</button>
        <button class="btn-gray" onclick="toggleSign()">+/-</button>
        <button class="btn-gray" onclick="percent()">%</button>
        <button class="btn-orange" onclick="setOperation('/')">÷</button>

        <button class="btn-dark" onclick="appendNumber('7')">7</button>
        <button class="btn-dark" onclick="appendNumber('8')">8</button>
        <button class="btn-dark" onclick="appendNumber('9')">9</button>
        <button class="btn-orange" onclick="setOperation('*')">×</button>

        <button class="btn-dark" onclick="appendNumber('4')">4</button>
        <button class="btn-dark" onclick="appendNumber('5')">5</button>
        <button class="btn-dark" onclick="appendNumber('6')">6</button>
        <button class="btn-orange" onclick="setOperation('-')">−</button>

        <button class="btn-dark" onclick="appendNumber('1')">1</button>
        <button class="btn-dark" onclick="appendNumber('2')">2</button>
        <button class="btn-dark" onclick="appendNumber('3')">3</button>
        <button class="btn-orange" onclick="setOperation('+')">+</button>

        <button class="btn-dark btn-zero" onclick="appendNumber('0')">0</button>
        <button class="btn-dark" onclick="appendDot()">.</button>
        <button class="btn-orange" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = null;
    let operation = null;
    let shouldResetDisplay = false;

    const displayElement = document.getElementById('display');

    function updateDisplay() {
        // Simple formatting to avoid massive decimals or overflow
        let displayValue = currentInput;
        if (displayValue.length > 9) {
            displayValue = displayValue.substring(0, 9);
        }
        displayElement.innerText = displayValue;
        
        // Dynamic font size for long numbers
        if (displayValue.length > 6) {
            displayElement.style.fontSize = '50px';
        } else {
            displayElement.style.fontSize = '80px';
        }
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendDot() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
        } else if (!currentInput.includes('.')) {
            currentInput += '.';
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = null;
        operation = null;
        shouldResetDisplay = false;
        updateDisplay();
    }

    function toggleSign() {
        currentInput = (parseFloat(currentInput) * -1).toString();
        updateDisplay();
    }

    function percent() {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
    }

    function setOperation(op) {
        if (operation !== null) calculate();
        previousInput = currentInput;
        operation = op;
        shouldResetDisplay = true;
    }

    function calculate() {
        if (operation === null || shouldResetDisplay) return;
        
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        let result;

        switch (operation) {
            case '+':
                result = prev + current;
                break;
            case '-':
                result = prev - current;
                break;
            case '*':
                result = prev * current;
                break;
            case '/':
                result = prev / current;
                break;
            default:
                return;
        }

        currentInput = result.toString();
        operation = null;
        previousInput = null;
        shouldResetDisplay = true;
        updateDisplay();
    }
</script>

</body>
</html>
